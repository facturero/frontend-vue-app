<svg xmlns="http://www.w3.org/2000/svg" width="620" height="520" viewBox="0 0 620 520" fill="none" role="img" aria-label="Panel de control">
  <defs>
    <linearGradient id="lgCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FD"/>
    </linearGradient>
    <linearGradient id="lgBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#078DEE"/>
      <stop offset="1" stop-color="#5FC1FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B3E63" flood-opacity="0.16"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B3E63" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- blobs de fondo -->
  <circle cx="92" cy="96" r="58" fill="#078DEE" opacity="0.10"/>
  <circle cx="556" cy="418" r="76" fill="#02CA4B" opacity="0.10"/>
  <circle cx="540" cy="86" r="26" fill="#EAB308" opacity="0.18"/>

  <!-- ventana principal -->
  <g filter="url(#soft)">
    <rect x="96" y="86" width="404" height="298" rx="18" fill="url(#lgCard)"/>
  </g>
  <path d="M96 104a18 18 0 0 1 18-18h368a18 18 0 0 1 18 18v22H96v-22Z" fill="#E8F1FB"/>
  <circle cx="120" cy="106" r="5" fill="#FB4141" opacity="0.75"/>
  <circle cx="138" cy="106" r="5" fill="#EAB308" opacity="0.75"/>
  <circle cx="156" cy="106" r="5" fill="#02CA4B" opacity="0.75"/>

  <!-- barra lateral -->
  <rect x="96" y="126" width="86" height="258" fill="#F1F6FC"/>
  <rect x="112" y="150" width="54" height="9" rx="4.5" fill="#078DEE" opacity="0.55"/>
  <rect x="112" y="174" width="42" height="9" rx="4.5" fill="#9FB4C7" opacity="0.45"/>
  <rect x="112" y="198" width="50" height="9" rx="4.5" fill="#9FB4C7" opacity="0.45"/>
  <rect x="112" y="222" width="38" height="9" rx="4.5" fill="#9FB4C7" opacity="0.45"/>
  <rect x="112" y="246" width="46" height="9" rx="4.5" fill="#9FB4C7" opacity="0.45"/>

  <!-- grafico de barras -->
  <rect x="206" y="150" width="120" height="10" rx="5" fill="#9FB4C7" opacity="0.5"/>
  <rect x="206" y="316" width="270" height="8" rx="4" fill="#E2EAF2"/>
  <rect x="212" y="266" width="26" height="50" rx="7" fill="url(#lgBar)" opacity="0.55"/>
  <rect x="254" y="234" width="26" height="82" rx="7" fill="url(#lgBar)" opacity="0.7"/>
  <rect x="296" y="196" width="26" height="120" rx="7" fill="url(#lgBar)"/>
  <rect x="338" y="250" width="26" height="66" rx="7" fill="url(#lgBar)" opacity="0.7"/>
  <rect x="380" y="214" width="26" height="102" rx="7" fill="url(#lgBar)" opacity="0.85"/>
  <rect x="422" y="278" width="26" height="38" rx="7" fill="url(#lgBar)" opacity="0.5"/>

  <!-- linea de tendencia -->
  <path d="M216 262 258 230 300 192 342 246 384 210 434 274" stroke="#02CA4B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="300" cy="192" r="6" fill="#FFFFFF" stroke="#02CA4B" stroke-width="3.5"/>

  <!-- tarjeta flotante: donut -->
  <g filter="url(#softer)">
    <rect x="392" y="330" width="184" height="126" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="440" cy="393" r="30" fill="none" stroke="#E4EDF6" stroke-width="12"/>
  <path d="M440 363a30 30 0 0 1 25.98 45.0" fill="none" stroke="#078DEE" stroke-width="12" stroke-linecap="round"/>
  <rect x="486" y="368" width="66" height="9" rx="4.5" fill="#9FB4C7" opacity="0.55"/>
  <rect x="486" y="388" width="48" height="9" rx="4.5" fill="#9FB4C7" opacity="0.35"/>
  <rect x="486" y="408" width="58" height="9" rx="4.5" fill="#9FB4C7" opacity="0.35"/>

  <!-- tarjeta flotante: usuario -->
  <g filter="url(#softer)">
    <rect x="34" y="286" width="186" height="86" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="76" cy="329" r="22" fill="#078DEE" opacity="0.15"/>
  <circle cx="76" cy="322" r="8" fill="#078DEE" opacity="0.7"/>
  <path d="M62 344a14 14 0 0 1 28 0Z" fill="#078DEE" opacity="0.7"/>
  <rect x="110" y="314" width="82" height="10" rx="5" fill="#9FB4C7" opacity="0.55"/>
  <rect x="110" y="334" width="56" height="10" rx="5" fill="#9FB4C7" opacity="0.32"/>

  <!-- candado -->
  <g filter="url(#softer)">
    <rect x="452" y="140" width="92" height="92" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="482" y="188" width="32" height="26" rx="6" fill="#078DEE"/>
  <path d="M488 188v-8a10 10 0 0 1 20 0v8" stroke="#078DEE" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
