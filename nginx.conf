server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos de Vite llevan un hash en el nombre: un despliegue nuevo trae nombres nuevos, así que pueden guardarse un año.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html (y la ruta que cae en él) se revalida siempre. Sin Cache-Control, Chrome lo guardaba por heurística y, tras un
  # despliegue, seguía cargando el build anterior durante horas (pasó el 2026-11-10 con el arreglo del menú lateral).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
